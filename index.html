<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f050b;
            --surface: #1a0b15;
            --surface-card: #220e1b;
            --surface-modal: #180913;
            --border: rgba(255, 46, 140, 0.18);
            --border-hover: rgba(255, 46, 140, 0.45);
            --accent: #ff2e8c;
            --accent-glow: rgba(255, 46, 140, 0.35);
            --accent-subtle: #9e1b58;
            --text-main: #fce8f3;
            --text-muted: #b886a4;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px 90px 16px;
            min-height: 100vh;
        }

        /* Шапка */
        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 0 0 18px 0;
            color: var(--text-main);
            text-align: left;
        }

        /* Категории */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-chip.active {
            background: rgba(255, 46, 140, 0.12);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Сетка фильмов */
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .movie-card {
            background: var(--surface-card);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s ease, border-color 0.2s ease;
        }

        .movie-card:active {
            transform: scale(0.98);
        }

        .movie-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .movie-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .movie-price {
            color: var(--accent);
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 12px;
        }

        /* Кнопки */
        .btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            width: 100%;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        .btn:active {
            background: #e02679;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        .btn-secondary:active {
            background: #25101e;
        }

        .btn-success {
            background: var(--success);
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.25);
        }

        /* Фиксированная админ-панель */
        .admin-footer {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15, 5, 11, 0.92);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            z-index: 90;
            backdrop-filter: blur(12px);
        }

        /* Модальные окна */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 2, 4, 0.82);
            padding: 16px;
            z-index: 999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-body {
            background: var(--surface-modal);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-hover);
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(255, 46, 140, 0.15);
        }

        .modal-title {
            margin: 0 0 16px 0;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
        }

        /* Переключатель вкладок админки */
        .admin-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: var(--surface);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .admin-tab {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 7px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            background: transparent;
            transition: all 0.2s;
        }

        .admin-tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Поля ввода */
        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        /* Экран и места */
        .screen-container {
            text-align: center;
            margin: 16px 0 20px 0;
        }

        .screen {
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            height: 2px;
            width: 80%;
            margin: 0 auto 6px auto;
            box-shadow: 0 0 10px var(--accent);
        }

        .screen-text {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .seats-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
        }

        .seat-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row-label {
            font-size: 11px;
            color: var(--text-muted);
            width: 40px;
        }

        .seat {
            width: 32px;
            height: 32px;
            background: var(--surface);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.15s ease;
        }

        .seat.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Способы оплаты */
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 14px 0 18px 0;
        }

        .pay-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pay-card.selected {
            border-color: var(--accent);
            background: rgba(255, 46, 140, 0.08);
            box-shadow: inset 0 0 12px rgba(255, 46, 140, 0.15);
        }

        .pay-title {
            font-weight: 500;
            font-size: 13px;
        }

        .pay-badge {
            font-size: 11px;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2 class="header-title">Афиша сеансов</h2>

    <div class="categories">
        <div class="cat-chip active" onclick="filterCat('all', this)">Все</div>
        <div class="cat-chip" onclick="filterCat('films', this)">Фильмы</div>
        <div class="cat-chip" onclick="filterCat('series', this)">Сериалы</div>
        <div class="cat-chip" onclick="filterCat('anime', this)">Аниме</div>
    </div>

    <div class="catalog-grid" id="movies-list"></div>

    <div class="admin-footer" id="adminPanel">
        <button class="btn btn-secondary" onclick="openAdminModal()">Панель управления</button>
    </div>

    <!-- Модальное окно админки -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-body">
            <h3 class="modal-title">Администрирование</h3>
            
            <div class="admin-tabs">
                <div class="admin-tab active" onclick="switchAdminTab('tab-add-movie', this)">Новый сеанс</div>
                <div class="admin-tab" onclick="switchAdminTab('tab-free-ticket', this)">Выдать билет</div>
            </div>

            <!-- Вкладка 1: Назначение фильма -->
            <div class="tab-content active" id="tab-add-movie">
                <label>Название</label>
                <input type="text" id="m-title" placeholder="Астрал 5">

                <label>Категория</label>
                <select id="m-category">
                    <option value="films">Фильмы</option>
                    <option value="series">Сериалы</option>
                    <option value="anime">Аниме</option>
                </select>

                <label>Жанр</label>
                <input type="text" id="m-genre" placeholder="Ужасы">

                <label>Цена (руб)</label>
                <input type="number" id="m-price" placeholder="350">

                <button class="btn" style="margin-top: 14px;" onclick="addMovie()">Добавить в расписание</button>
            </div>

            <!-- Вкладка 2: Выдача бесплатного билета -->
            <div class="tab-content" id="tab-free-ticket">
                <label>Фильм</label>
                <select id="free-movie-select"></select>

                <label>Сеанс</label>
                <select id="free-session-time">
                    <option value="Сегодня в 18:00">Сегодня в 18:00</option>
                    <option value="Сегодня в 21:00">Сегодня в 21:00</option>
                    <option value="Завтра в 19:30">Завтра в 19:30</option>
                </select>

                <label>Ряд</label>
                <input type="number" id="free-row" min="1" max="3" value="1">

                <label>Место</label>
                <input type="number" id="free-seat" min="1" max="5" value="1">

                <button class="btn btn-success" style="margin-top: 14px;" onclick="issueFreeTicket()">Сформировать билет</button>
            </div>

            <button class="btn btn-secondary" style="margin-top: 10px;" onclick="closeModal('adminModal')">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно бронирования -->
    <div class="modal-overlay" id="bookingModal">
        <div class="modal-body">
            <h3 class="modal-title" id="book-title"></h3>

            <label>Время сеанса</label>
            <select id="session-time">
                <option value="Сегодня в 18:00">Сегодня в 18:00</option>
                <option value="Сегодня в 21:00">Сегодня в 21:00</option>
                <option value="Завтра в 19:30">Завтра в 19:30</option>
            </select>

            <div class="screen-container">
                <div class="screen"></div>
                <div class="screen-text">Экран</div>
            </div>

            <div class="seats-grid" id="seats-container"></div>

            <div id="booking-info" style="text-align:center; font-size:12px; margin-bottom:14px; color:var(--text-muted);">
                Выберите место
            </div>

            <button class="btn" onclick="goToPayment()">Продолжить</button>
            <button class="btn btn-secondary" style="margin-top: 8px;" onclick="closeModal('bookingModal')">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно оплаты -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-body">
            <h3 class="modal-title">Детали оплаты</h3>
            
            <div id="payment-summary" style="font-size:13px; color:var(--text-muted); line-height: 1.6; margin-bottom:14px; background: var(--surface); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);"></div>

            <label>Способ оплаты</label>
            <div class="payment-options">
                <div class="pay-card selected" onclick="selectPayment(this, 'DonationAlerts')">
                    <span class="pay-title">DonationAlerts</span>
                    <span class="pay-badge">Быстро</span>
                </div>
                <div class="pay-card" onclick="selectPayment(this, 'Банковская карта')">
                    <span class="pay-title">Карта / СБП</span>
                    <span class="pay-badge">ЮKassa</span>
                </div>
                <div class="pay-card" onclick="selectPayment(this, 'Telegram Stars')">
                    <span class="pay-title">Telegram Stars</span>
                    <span class="pay-badge">Stars</span>
                </div>
                <div class="pay-card" onclick="selectPayment(this, 'CryptoBot')">
                    <span class="pay-title">CryptoBot</span>
                    <span class="pay-badge">USDT / TON</span>
                </div>
            </div>

            <button class="btn btn-success" onclick="processPayment()">Перейти к оплате <span id="pay-amount"></span></button>
            <button class="btn btn-secondary" style="margin-top: 8px;" onclick="closeModal('paymentModal')">Назад</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const ADMINS = ["siqhnn", "fuckvskrytiye", "polomad"];
        const user = tg.initDataUnsafe?.user;
        const currentUsername = (user?.username || "").toLowerCase();

        if (ADMINS.includes(currentUsername)) {
            document.getElementById('adminPanel').style.display = 'block';
        }

        let moviesData = [
            { id: 1, title: "Астрал 5", category: "films", genre: "Ужасы", price: 350 },
            { id: 2, title: "Атака Титанов", category: "anime", genre: "Боевик", price: 300 }
        ];

        let selectedMovie = null;
        let selectedSeat = null;
        let selectedMethod = "DonationAlerts";

        function renderMovies(filter = 'all') {
            const list = document.getElementById('movies-list');
            list.innerHTML = '';

            moviesData.forEach(m => {
                if (filter === 'all' || m.category === filter) {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <div>
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-meta">${m.genre}</div>
                            <div class="movie-price">${m.price} ₽</div>
                        </div>
                        <button class="btn" onclick="openBookingModal(${m.id})">Билеты</button>
                    `;
                    list.appendChild(card);
                }
            });
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderMovies(cat);
        }

        function switchAdminTab(tabId, el) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function openAdminModal() {
            const select = document.getElementById('free-movie-select');
            select.innerHTML = '';
            moviesData.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.title;
                opt.innerText = m.title;
                select.appendChild(opt);
            });
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function addMovie() {
            const title = document.getElementById('m-title').value.trim();
            const category = document.getElementById('m-category').value;
            const genre = document.getElementById('m-genre').value.trim() || "Фильм";
            const price = document.getElementById('m-price').value || 300;

            if (!title) return alert("Укажите название фильма");

            moviesData.push({ id: Date.now(), title, category, genre, price });
            renderMovies();
            closeModal('adminModal');

            document.getElementById('m-title').value = '';
            document.getElementById('m-genre').value = '';
            document.getElementById('m-price').value = '';
        }

        function issueFreeTicket() {
            const movie = document.getElementById('free-movie-select').value;
            const session = document.getElementById('free-session-time').value;
            const row = document.getElementById('free-row').value;
            const seat = document.getElementById('free-seat').value;

            if (!movie) return alert("Выберите фильм");

            tg.sendData(JSON.stringify({
                action: "free_ticket",
                movie: movie,
                session: session,
                row: row,
                seat: seat
            }));
            closeModal('adminModal');
        }

        function openBookingModal(movieId) {
            selectedMovie = moviesData.find(m => m.id === movieId);
            selectedSeat = null;
            document.getElementById('book-title').innerText = selectedMovie.title;
            document.getElementById('booking-info').innerText = "Выберите место";

            const seatsContainer = document.getElementById('seats-container');
            seatsContainer.innerHTML = '';

            for (let r = 1; r <= 3; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'seat-row';
                
                const label = document.createElement('div');
                label.className = 'row-label';
                label.innerText = `Ряд ${r}`;
                rowDiv.appendChild(label);

                for (let s = 1; s <= 5; s++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.innerText = s;
                    seat.onclick = () => selectSeat(seat, r, s);
                    rowDiv.appendChild(seat);
                }
                seatsContainer.appendChild(rowDiv);
            }

            document.getElementById('bookingModal').style.display = 'flex';
        }

        function selectSeat(el, row, seatNum) {
            document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            selectedSeat = { row, seat: seatNum };
            document.getElementById('booking-info').innerHTML = `Выбрано: Ряд ${row}, Место ${seatNum}`;
        }

        function goToPayment() {
            if (!selectedSeat) return alert("Выберите место на схеме");
            
            closeModal('bookingModal');
            
            const session = document.getElementById('session-time').value;
            document.getElementById('payment-summary').innerHTML = `
                <b>Фильм:</b> ${selectedMovie.title}<br>
                <b>Сеанс:</b> ${session}<br>
                <b>Место:</b> Ряд ${selectedSeat.row}, Место ${selectedSeat.seat}<br>
                <b>К оплате:</b> ${selectedMovie.price} ₽
            `;
            document.getElementById('pay-amount').innerText = `(${selectedMovie.price} ₽)`;

            document.getElementById('paymentModal').style.display = 'flex';
        }

        function selectPayment(el, method) {
            document.querySelectorAll('.pay-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedMethod = method;
        }

        function processPayment() {
            const session = document.getElementById('session-time').value;

            tg.sendData(JSON.stringify({
                action: "pay",
                movie: selectedMovie.title,
                session: session,
                row: selectedSeat.row,
                seat: selectedSeat.seat,
                price: selectedMovie.price,
                method: selectedMethod
            }));
        }

        renderMovies();
    </script>
</body>
</html>
