<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вибір місць — Кинотеатр</title>
    <!-- Подключение Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18181e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 5px;
        }

        .screen {
            width: 80%;
            height: 15px;
            background: #444;
            margin: 20px 0;
            border-radius: 5px;
            text-align: center;
            font-size: 10px;
            line-height: 15px;
            color: #aaa;
            box-shadow: 0 3px 10px rgba(255, 255, 255, 0.2);
        }

        .cinema-hall {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .seat {
            width: 45px;
            height: 45px;
            background-color: #2e3138;
            border: 1px solid #4f535d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .seat.selected {
            background-color: #31b545;
            color: #fff;
            border-color: #279638;
        }

        .info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>🍿 Выбор мест</h2>
    <div class="info">Нажмите на кресло, чтобы выбрать место</div>

    <div class="screen">ЭКРАН</div>

    <div class="cinema-hall" id="hall">
        <!-- Места генерируются скриптом -->
    </div>

    <div class="info" id="selected-info">Выбрано мест: 0</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран

        // Настройка главной кнопки Telegram
        tg.MainButton.setText("ПОДТВЕРДИТЬ ВЫБОР");
        tg.MainButton.setTextColor("#FFFFFF");
        tg.MainButton.setColor("#31b545");

        const hall = document.getElementById('hall');
        const selectedInfo = document.getElementById('selected-info');
        const totalSeats = 15;
        const selectedSeats = new Set();

        // Генерация сетки кресел
        for (let i = 1; i <= totalSeats; i++) {
            const seat = document.createElement('div');
            seat.classList.add('seat');
            seat.innerText = i;
            seat.addEventListener('click', () => toggleSeat(i, seat));
            hall.appendChild(seat);
        }

        function toggleSeat(seatNum, seatElement) {
            if (selectedSeats.has(seatNum)) {
                selectedSeats.delete(seatNum);
                seatElement.classList.remove('selected');
            } else {
                selectedSeats.add(seatNum);
                seatElement.classList.add('selected');
            }

            selectedInfo.innerText = `Выбрано мест: ${selectedSeats.size}`;

            if (selectedSeats.size > 0) {
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // Отправка данных обратно в Telegram бот
        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            const data = {
                action: "booking",
                session_id: 1,
                seats: Array.from(selectedSeats)
            };
            tg.sendData(JSON.stringify(data)); // Передаем JSON в бот
        });
    </script>
</body>
</html>
