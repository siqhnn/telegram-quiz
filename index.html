<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сакура Кинотеатр</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 15px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn { background: #ff4757; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .btn-promo { background: #2ed573; }
    .card { background: #2f3542; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
    .modal-content { background: #2f3542; padding: 20px; border-radius: 10px; width: 80%; max-width: 400px; }
    input, select { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    .admin-section { border-top: 2px solid #57606f; margin-top: 25px; padding-top: 15px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; background: #57606f; padding: 8px; margin-bottom: 5px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- ХЕДЕР И КНОПКА ПРОМОКОДЫ -->
  <div class="header">
    <h2>🍿 Сакура Кино</h2>
    <button class="btn btn-promo" onclick="openPromoModal()">🏷️ Промокод</button>
  </div>

  <!-- СПИСОК СЕАНСОВ / БИЛЕТОВ -->
  <div id="movies-list"></div>

  <!-- АДМИН ПАНЕЛЬ (Управление сеансами/билетами) -->
  <div id="admin-panel" class="admin-section" style="display: none;">
    <h3>⚙️ Админ-панель (Управление)</h3>
    <div id="admin-movies-list"></div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ПРОМОКОДОВ -->
  <div id="promo-modal" class="modal">
    <div class="modal-content">
      <h3>Ввести промокод</h3>
      <input type="text" id="promo-input" placeholder="Введите промокод (напр. сакура)">
      <button class="btn btn-promo" onclick="applyPromo()">Применить</button>
      <button class="btn" style="background:#747d8c; margin-top:5px;" onclick="closePromoModal()">Закрыть</button>
      <p id="promo-msg" style="font-size: 14px; margin-top: 10px;"></p>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Список доступных промокодов
    const PROMOCODES = {
      "сакура": 0.10,   // 10% скидка
      "психолог": 0.30 // 30% скидка
    };

    let activeDiscount = 0; // Текущая скидка
    let isAdmin = false;

    // Начальные данные сеансов
    let movies = [
      { id: 1, title: "Человек-паук", session: "18:00", price: 300 },
      { id: 2, title: "Бэтмен", session: "21:00", price: 400 }
    ];

    // Проверка прав админа при загрузке
    const adminUsernames = ["siqhnn", "fuckvskrytiye", "polomad"];
    const currentUser = tg.initDataUnsafe?.user?.username?.toLowerCase();
    if (adminUsernames.includes(currentUser)) {
      isAdmin = true;
      document.getElementById('admin-panel').style.display = 'block';
    }

    function render() {
      // Отрисовка для пользователей
      const list = document.getElementById('movies-list');
      list.innerHTML = '';
      movies.forEach(m => {
        const finalPrice = Math.round(m.price * (1 - activeDiscount));
        const priceText = activeDiscount > 0 
          ? `<s>${m.price} ₽</s> <b>${finalPrice} ₽</b>` 
          : `${m.price} ₽`;

        list.innerHTML += `
          <div class="card">
            <h4>${m.title}</h4>
            <p>Время: ${m.session}</p>
            <p>Цена: ${priceText}</p>
            <button class="btn" onclick="buyTicket(${m.id}, ${finalPrice})">Забронировать</button>
          </div>
        `;
      });

      // Отрисовка админки (Управление)
      if (isAdmin) {
        const adminList = document.getElementById('admin-movies-list');
        adminList.innerHTML = '';
        movies.forEach(m => {
          adminList.innerHTML += `
            <div class="item-row">
              <span>${m.title} (${m.session}) - ${m.price}₽</span>
              <div>
                <button class="btn" style="background:#eccc68;" onclick="editMovie(${m.id})">✏️</button>
                <button class="btn" style="background:#ff4757;" onclick="deleteMovie(${m.id})">🗑️</button>
              </div>
            </div>
          `;
        });
      }
    }

    // Промокоды
    function openPromoModal() { document.getElementById('promo-modal').style.display = 'flex'; }
    function closePromoModal() { document.getElementById('promo-modal').style.display = 'none'; }

    function applyPromo() {
      const input = document.getElementById('promo-input').value.trim().toLowerCase();
      const msg = document.getElementById('promo-msg');

      if (PROMOCODES[input]) {
        activeDiscount = PROMOCODES[input];
        msg.style.color = '#2ed573';
        msg.innerText = `Промокод применен! Скидка ${activeDiscount * 100}%`;
        render();
        setTimeout(closePromoModal, 1200);
      } else {
        msg.style.color = '#ff4757';
        msg.innerText = 'Неверный промокод';
      }
    }

    // Админ-функции: Редактирование и Удаление
    function deleteMovie(id) {
      movies = movies.filter(m => m.id !== id);
      render();
    }

    function editMovie(id) {
      const movie = movies.find(m => m.id === id);
      if (!movie) return;

      const newTitle = prompt("Новое название:", movie.title);
      const newSession = prompt("Новое время:", movie.session);
      const newPrice = prompt("Новая цена:", movie.price);

      if (newTitle && newSession && newPrice) {
        movie.title = newTitle;
        movie.session = newSession;
        movie.price = Number(newPrice);
        render();
      }
    }

    function buyTicket(id, price) {
      const movie = movies.find(m => m.id === id);
      tg.sendData(JSON.stringify({
        action: "pay",
        movie: movie.title,
        session: movie.session,
        price: price,
        row: 3,
        seat: 12,
        method: "Онлайн"
      }));
    }

    render();
  </script>
</body>
</html>
