<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр Сакура</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d060a;
            --card-bg: rgba(26, 15, 22, 0.75);
            --accent: #e11d48;
            --text: #ffffff;
            --text-muted: #fda4af;
            --border: rgba(225, 29, 72, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color) url('bg.jpg') no-repeat center top / cover fixed;
            color: var(--text);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            padding-bottom: 90px;
            padding-top: 140px; /* Отступ сверху, чтобы логотип "Сакура" оставался видимым */
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .cat-chip {
            background: rgba(20, 10, 16, 0.8);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .cat-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.5);
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .movie-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .movie-time {
            color: #f43f5e;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .admin-footer {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0; 
            right: 0;
            background: rgba(13, 6, 10, 0.95);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            z-index: 90;
            backdrop-filter: blur(10px);
        }

        .admin-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            background: #1a0f16;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 14px 0;
            background: #0d060a;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h3 style="text-align: center; margin-bottom: 15px;">🌸 Расписание сеансов</h3>

    <div class="categories">
        <div class="cat-chip active" onclick="filterCat('all', this)">Все</div>
        <div class="cat-chip" onclick="filterCat('horror', this)">👻 Ужасы</div>
        <div class="cat-chip" onclick="filterCat('films', this)">🎬 Фильмы</div>
        <div class="cat-chip" onclick="filterCat('anime', this)">⛩ Аниме</div>
        <div class="cat-chip" onclick="filterCat('series', this)">📺 Сериалы</div>
    </div>

    <div class="catalog-grid" id="movies-list"></div>

    <div class="admin-footer" id="adminPanel">
        <button class="admin-btn" onclick="openAdminModal()">⚙️ Панель администратора</button>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-body">
            <h3 style="margin-top:0;">Запланировать показ</h3>
            
            <label>Название фильма / сериала:</label>
            <input type="text" id="m-title" placeholder="Например: Астрал 5">

            <label>Жанр:</label>
            <select id="m-genre">
                <option value="horror">👻 Ужасы / Хоррор</option>
                <option value="films">🎬 Фильм</option>
                <option value="anime">⛩ Аниме</option>
                <option value="series">📺 Сериал</option>
            </select>

            <label>Время начала:</label>
            <input type="text" id="m-time" placeholder="Например: 20:00">

            <label>День недели / Дата:</label>
            <input type="text" id="m-day" placeholder="Сегодня / Завтра / Пятница">

            <button class="btn" style="width:100%; padding:12px; margin-bottom:8px;" onclick="addMovie()">Запланировать показ</button>
            <button class="btn" style="width:100%; padding:10px; background:#475569;" onclick="closeAdminModal()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const ADMINS = ["siqhnn", "fuckvskrytiye", "polomad"];

        const user = tg.initDataUnsafe?.user;
        const currentUsername = (user?.username || "").toLowerCase();

        if (ADMINS.includes(currentUsername)) {
            document.getElementById('adminPanel').style.display = 'block';
        }

        let moviesData = [
            { id: 1, title: "Астрал 5", genre: "horror", time: "18:00", day: "Сегодня" },
            { id: 2, title: "Интерстеллар", genre: "films", time: "21:00", day: "Завтра" }
        ];

        function renderMovies(filter = 'all') {
            const list = document.getElementById('movies-list');
            list.innerHTML = '';

            moviesData.forEach(m => {
                if (filter === 'all' || m.genre === filter) {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <div>
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-time">⏰ ${m.day} в ${m.time}</div>
                        </div>
                        <button class="btn" onclick="joinSession('${m.title}')">Смотреть</button>
                    `;
                    list.appendChild(card);
                }
            });
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderMovies(cat);
        }

        function openAdminModal() { 
            document.getElementById('adminModal').style.display = 'flex'; 
        }

        function closeAdminModal() { 
            document.getElementById('adminModal').style.display = 'none'; 
        }

        function addMovie() {
            const title = document.getElementById('m-title').value.trim();
            const genre = document.getElementById('m-genre').value;
            const time = document.getElementById('m-time').value.trim();
            const day = document.getElementById('m-day').value.trim();

            if (!title || !time) {
                alert("Пожалуйста, заполните название и время!");
                return;
            }

            moviesData.push({ id: Date.now(), title, genre, time, day: day || 'Сегодня' });
            renderMovies();
            closeAdminModal();

            document.getElementById('m-title').value = '';
            document.getElementById('m-time').value = '';
            document.getElementById('m-day').value = '';
        }

        function joinSession(title) {
            tg.sendData(JSON.stringify({ action: "watch", movie: title }));
        }

        renderMovies();
    </script>
</body>
</html>
