<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор мест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 5px;
        }

        .cinema-hall {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 25px 0;
        }

        .seat {
            width: 45px;
            height: 45px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .seat.selected {
            background-color: #22c55e;
            color: #fff;
            border-color: #16a34a;
        }

        .info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #94a3b8);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>🍿 Выбор мест</h2>
    <div class="info">Нажмите на кресло, чтобы выбрать место</div>

    <div class="cinema-hall" id="hall"></div>

    <div class="info" id="selected-info">Выбрано мест: 0</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        tg.MainButton.setText("ПОДТВЕРДИТЬ ВЫБОР");
        tg.MainButton.setTextColor("#FFFFFF");
        tg.MainButton.setColor("#22c55e");

        const hall = document.getElementById('hall');
        const selectedInfo = document.getElementById('selected-info');
        const totalSeats = 15;
        const selectedSeats = new Set();

        for (let i = 1; i <= totalSeats; i++) {
            const seat = document.createElement('div');
            seat.classList.add('seat');
            seat.innerText = i;
            seat.addEventListener('click', () => toggleSeat(i, seat));
            hall.appendChild(seat);
        }

        function toggleSeat(seatNum, seatElement) {
            if (selectedSeats.has(seatNum)) {
                selectedSeats.delete(seatNum);
                seatElement.classList.remove('selected');
            } else {
                selectedSeats.add(seatNum);
                seatElement.classList.add('selected');
            }

            selectedInfo.innerText = `Выбрано мест: ${selectedSeats.size}`;

            if (selectedSeats.size > 0) {
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            const data = {
                action: "booking",
                session_id: 1,
                seats: Array.from(selectedSeats)
            };
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
