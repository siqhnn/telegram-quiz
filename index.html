<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-num {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .btn:active {
            transform: scale(0.98);
            background: var(--accent);
        }
        .finish-card {
            text-align: center;
        }
        .score-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .score-desc {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .action-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
        <div class="question-num" id="q-num">Вопрос 1 из 10</div>
        <div class="question-text" id="q-text">Загрузка...</div>
        <div class="options" id="options"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // НАСТРОЙКА ВОПРОСОВ (меняй текст и правильные ответы здесь)
        const quizData = [
            { q: "Какой у меня любимый цвет?", options: ["Синий", "Красный", "Черный", "Зеленый"], correct: 0 },
            { q: "Что я больше всего люблю есть?", options: ["Пиццу", "Суши", "Бургеры", "Пасту"], correct: 1 },
            { q: "В каком году мы познакомились?", options: ["2021", "2022", "2023", "2024"], correct: 2 },
            { q: "Сова или жаворонок?", options: ["Сова", "Жаворонок", "Сплю всегда", "Не сплю"], correct: 0 },
            { q: "Любимый жанр фильмов?", options: ["Ужасы", "Комедии", "Фантастика", "Драмы"], correct: 2 },
            { q: "Какой напиток я выберу?", options: ["Кофе", "Чай", "Энергетик", "Воду"], correct: 0 },
            { q: "Куда я хочу поехать больше всего?", options: ["Горы", "Море", "Япония", "Исландия"], correct: 3 },
            { q: "Какое у меня главное хобби?", options: ["Игры", "Музыка", "Спорт", "Чтение"], correct: 0 },
            { q: "Какой мой любимый время года?", options: ["Зима", "Весна", "Лето", "Осень"], correct: 3 },
            { q: "Кто тут самая лучшая девочка?", options: ["Ты", "Точно ты", "100% ты", "Без вариантов ты"], correct: 0 }
        ];

        let currentQ = 0;
        let score = 0;

        function loadQuestion() {
            if (currentQ >= quizData.length) {
                showResult();
                return;
            }
            const q = quizData[currentQ];
            document.getElementById('q-num').innerText = `Вопрос ${currentQ + 1} из ${quizData.length}`;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('progress').style.width = `${((currentQ) / quizData.length) * 100}%`;

            const optsDiv = document.getElementById('options');
            optsDiv.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(idx);
                optsDiv.appendChild(btn);
            });
        }

        function selectAnswer(idx) {
            if (idx === quizData[currentQ].correct) score++;
            currentQ++;
            loadQuestion();
        }

        function showResult() {
            const passed = score > 6;
            document.getElementById('app').innerHTML = `
                <div class="finish-card">
                    <div class="score-title">${passed ? '🎉 Победа!' : '🙈 Почти получилось!'}</div>
                    <div class="score-desc">Ты ответила правильно на <b>${score}</b> из 10 вопросов.</div>
                    <button class="action-btn" onclick="sendData(${score})">Завершить</button>
                </div>
            `;
        }

        function sendData(finalScore) {
            tg.sendData(JSON.stringify({ score: finalScore }));
        }

        loadQuestion();
    </script>
</body>
</html>
