<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр Сакура</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d060a;
            --card-bg: rgba(26, 15, 22, 0.85);
            --accent: #e11d48;
            --accent-hover: #f43f5e;
            --text: #ffffff;
            --text-muted: #fda4af;
            --border: rgba(225, 29, 72, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color) url('bg.jpg') no-repeat center top / cover fixed;
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-top: 140px;
            padding-bottom: 90px;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .cat-chip {
            background: rgba(20, 10, 16, 0.85);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .cat-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(225, 29, 72, 0.6);
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .movie-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .movie-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .movie-price {
            color: #22c55e;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:active { opacity: 0.85; }

        .admin-footer {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(13, 6, 10, 0.95);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            z-index: 90;
            backdrop-filter: blur(12px);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            z-index: 999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-body {
            background: #180c14;
            padding: 22px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 25px rgba(225, 29, 72, 0.25);
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin: 6px 0 14px 0;
            background: #0d060a;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .screen-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .screen {
            background: #e11d48;
            height: 4px;
            width: 80%;
            margin: 0 auto 6px auto;
            box-shadow: 0 0 15px #e11d48;
            border-radius: 2px;
        }

        .screen-text {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .seats-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .seat-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row-label {
            font-size: 11px;
            color: var(--text-muted);
            width: 45px;
        }

        .seat {
            width: 34px;
            height: 34px;
            background: #2a1722;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .seat.selected {
            background: #22c55e;
            border-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }

        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .pay-card {
            background: #0d060a;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .pay-card.selected {
            border-color: var(--accent);
            background: rgba(225, 29, 72, 0.15);
        }

        .pay-icon { font-size: 20px; }
        .pay-title { font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <h3 style="text-align: center; margin-bottom: 15px;">🌸 Расписание сеансов</h3>

    <div class="categories">
        <div class="cat-chip active" onclick="filterCat('all', this)">Все</div>
        <div class="cat-chip" onclick="filterCat('films', this)">🎬 Фильмы</div>
        <div class="cat-chip" onclick="filterCat('series', this)">📺 Сериалы</div>
        <div class="cat-chip" onclick="filterCat('anime', this)">⛩ Аниме</div>
    </div>

    <div class="catalog-grid" id="movies-list"></div>

    <div class="admin-footer" id="adminPanel">
        <button class="btn" style="background: var(--accent);" onclick="openAdminModal()">⚙️ Панель администратора</button>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-body">
            <h3 style="margin-top:0;">Запланировать показ</h3>
            
            <label>Название:</label>
            <input type="text" id="m-title" placeholder="Например: Астрал 5">

            <label>Категория:</label>
            <select id="m-category">
                <option value="films">🎬 Фильмы</option>
                <option value="series">📺 Сериалы</option>
                <option value="anime">⛩ Аниме</option>
            </select>

            <label>Жанр:</label>
            <input type="text" id="m-genre" placeholder="Ужасы / Драма">

            <label>Цена (руб):</label>
            <input type="number" id="m-price" placeholder="350">

            <button class="btn" style="margin-bottom:8px;" onclick="addMovie()">Добавить сеанс</button>
            <button class="btn" style="background:#475569;" onclick="closeModal('adminModal')">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="bookingModal">
        <div class="modal-body">
            <h3 id="book-title" style="margin-top:0; text-align:center;"></h3>

            <label>Выберите дата и время:</label>
            <select id="session-time">
                <option value="Сегодня в 18:00">Сегодня в 18:00</option>
                <option value="Сегодня в 21:00">Сегодня в 21:00</option>
                <option value="Завтра в 19:30">Завтра в 19:30</option>
            </select>

            <div class="screen-container">
                <div class="screen"></div>
                <div class="screen-text">ЭКРАН</div>
            </div>

            <div class="seats-grid" id="seats-container"></div>

            <div id="booking-info" style="text-align:center; font-size:13px; margin-bottom:15px; color:var(--text-muted);">
                Выберите место на схеме
            </div>

            <button class="btn" style="margin-bottom:8px;" onclick="goToPayment()">Перейти к оплате</button>
            <button class="btn" style="background:#475569;" onclick="closeModal('bookingModal')">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="paymentModal">
        <div class="modal-body">
            <h3 style="margin-top:0; text-align:center;">Оплата билета</h3>
            
            <div id="payment-summary" style="font-size:13px; color:var(--text-muted); margin-bottom:15px;"></div>

            <label>Выберите способ оплаты:</label>
            <div class="payment-options">
                <div class="pay-card selected" onclick="selectPayment(this, 'DonationAlerts')">
                    <span class="pay-icon">🧡</span>
                    <span class="pay-title">DonationAlerts</span>
                </div>
                <div class="pay-card" onclick="selectPayment(this, 'Банковская карта')">
                    <span class="pay-icon">💳</span>
                    <span class="pay-title">Банковская карта (СБП)</span>
                </div>
                <div class="pay-card" onclick="selectPayment(this, 'Telegram Stars')">
                    <span class="pay-icon">⭐</span>
                    <span class="pay-title">Telegram Stars</span>
                </div>
                <div class="pay-card" onclick="selectPayment(this, 'CryptoBot')">
                    <span class="pay-icon">💎</span>
                    <span class="pay-title">CryptoBot (USDT / TON)</span>
                </div>
            </div>

            <button class="btn" style="margin-bottom:8px; background:#22c55e;" onclick="processPayment()">Оплатить <span id="pay-amount"></span></button>
            <button class="btn" style="background:#475569;" onclick="closeModal('paymentModal')">Назад</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const ADMINS = ["siqhnn", "fuckvskrytiye", "polomad"];
        const user = tg.initDataUnsafe?.user;
        const currentUsername = (user?.username || "").toLowerCase();

        if (ADMINS.includes(currentUsername)) {
            document.getElementById('adminPanel').style.display = 'block';
        }

        let moviesData = [
            { id: 1, title: "Астрал 5", category: "films", genre: "Ужасы", price: 350 },
            { id: 2, title: "Атака Титанов", category: "anime", genre: "Боевик / Аниме", price: 300 }
        ];

        let selectedMovie = null;
        let selectedSeat = null;
        let selectedMethod = "DonationAlerts";

        function renderMovies(filter = 'all') {
            const list = document.getElementById('movies-list');
            list.innerHTML = '';

            moviesData.forEach(m => {
                if (filter === 'all' || m.category === filter) {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <div>
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-meta">Жанр: ${m.genre}</div>
                            <div class="movie-price">${m.price} ₽</div>
                        </div>
                        <button class="btn" onclick="openBookingModal(${m.id})">Забронировать</button>
                    `;
                    list.appendChild(card);
                }
            });
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderMovies(cat);
        }

        function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function addMovie() {
            const title = document.getElementById('m-title').value.trim();
            const category = document.getElementById('m-category').value;
            const genre = document.getElementById('m-genre').value.trim() || "Фильм";
            const price = document.getElementById('m-price').value || 300;

            if (!title) return alert("Заполните название!");

            moviesData.push({ id: Date.now(), title, category, genre, price });
            renderMovies();
            closeModal('adminModal');

            document.getElementById('m-title').value = '';
            document.getElementById('m-genre').value = '';
            document.getElementById('m-price').value = '';
        }

        function openBookingModal(movieId) {
            selectedMovie = moviesData.find(m => m.id === movieId);
            selectedSeat = null;
            document.getElementById('book-title').innerText = selectedMovie.title;
            document.getElementById('booking-info').innerText = "Выберите место на схеме";

            const seatsContainer = document.getElementById('seats-container');
            seatsContainer.innerHTML = '';

            for (let r = 1; r <= 3; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'seat-row';
                
                const label = document.createElement('div');
                label.className = 'row-label';
                label.innerText = `Ряд ${r}`;
                rowDiv.appendChild(label);

                for (let s = 1; s <= 5; s++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.innerText = s;
                    seat.onclick = () => selectSeat(seat, r, s);
                    rowDiv.appendChild(seat);
                }
                seatsContainer.appendChild(rowDiv);
            }

            document.getElementById('bookingModal').style.display = 'flex';
        }

        function selectSeat(el, row, seatNum) {
            document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            selectedSeat = { row, seat: seatNum };
            document.getElementById('booking-info').innerHTML = `Выбрано: <b>Ряд ${row}, Место ${seatNum}</b>`;
        }

        function goToPayment() {
            if (!selectedSeat) return alert("Пожалуйста, выберите место!");
            
            closeModal('bookingModal');
            
            const session = document.getElementById('session-time').value;
            document.getElementById('payment-summary').innerHTML = `
                🎬 <b>Фильм:</b> ${selectedMovie.title}<br>
                ⏰ <b>Сеанс:</b> ${session}<br>
                💺 <b>Место:</b> Ряд ${selectedSeat.row}, Место ${selectedSeat.seat}<br>
                💵 <b>Сумма к оплате:</b> ${selectedMovie.price} ₽
            `;
            document.getElementById('pay-amount').innerText = `(${selectedMovie.price} ₽)`;

            document.getElementById('paymentModal').style.display = 'flex';
        }

        function selectPayment(el, method) {
            document.querySelectorAll('.pay-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedMethod = method;
        }

        function processPayment() {
            const session = document.getElementById('session-time').value;

            tg.sendData(JSON.stringify({
                action: "pay",
                movie: selectedMovie.title,
                session: session,
                row: selectedSeat.row,
                seat: selectedSeat.seat,
                price: selectedMovie.price,
                method: selectedMethod
            }));
        }

        renderMovies();
    </script>
</body>
</html>
