<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f050b;
            --surface: #1a0b15;
            --surface-card: #220e1b;
            --surface-modal: #180913;
            --border: rgba(255, 46, 140, 0.18);
            --border-hover: rgba(255, 46, 140, 0.45);
            --accent: #ff2e8c;
            --accent-glow: rgba(255, 46, 140, 0.35);
            --text-main: #fce8f3;
            --text-muted: #b886a4;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px 90px 16px;
            min-height: 100vh;
        }

        /* Анимация запуска */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }

        .loader-ring {
            width: 42px;
            height: 42px;
            border: 3px solid var(--surface);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 18px 0;
        }

        /* Категории */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background: rgba(255, 46, 140, 0.12);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Карточки фильмов */
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .movie-card {
            background: var(--surface-card);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .poster-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #200817;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .age-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 5, 11, 0.85);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            color: var(--accent);
        }

        .movie-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: 700;
        }

        .movie-meta-text {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .movie-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .movie-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        /* Кнопки */
        .btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        .btn-success {
            background: var(--success);
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.25);
        }

        .admin-footer {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15, 5, 11, 0.92);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            z-index: 90;
            backdrop-filter: blur(12px);
        }

        /* Модалки */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 2, 4, 0.85);
            padding: 16px;
            z-index: 999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-body {
            background: var(--surface-modal);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-hover);
            max-height: 88vh;
            overflow-y: auto;
        }

        /* Админ вкладки */
        .admin-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            background: var(--surface);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .admin-tab {
            flex: 1;
            padding: 7px 2px;
            border: none;
            border-radius: 7px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            background: transparent;
        }

        .admin-tab.active {
            background: var(--accent);
            color: #fff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            margin-bottom: 3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px 11px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        /* Схема зала */
        .screen-container { text-align: center; margin: 16px 0; }
        .screen { background: var(--accent); height: 2px; width: 80%; margin: 0 auto 4px auto; box-shadow: 0 0 10px var(--accent); }
        .screen-text { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; }

        .seats-grid { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-bottom: 16px; }
        .seat-row { display: flex; gap: 8px; align-items: center; }
        .row-label { font-size: 11px; color: var(--text-muted); width: 40px; }
        .seat {
            width: 32px; height: 32px; background: var(--surface); border-radius: 7px;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            font-weight: 600; cursor: pointer; border: 1px solid var(--border);
        }
        .seat.selected { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 10px var(--accent-glow); }

        /* Оплата */
        .pay-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .pay-card.selected { border-color: var(--accent); background: rgba(255, 46, 140, 0.08); }
    </style>
</head>
<body>

    <!-- Анимация запуска -->
    <div id="splash-screen">
        <div class="loader-ring"></div>
    </div>

    <h2 class="header-title">Афиша сеансов</h2>

    <div class="categories">
        <div class="cat-chip active" onclick="filterCat('all', this)">Все</div>
        <div class="cat-chip" onclick="filterCat('films', this)">Фильмы</div>
        <div class="cat-chip" onclick="filterCat('series', this)">Сериалы</div>
        <div class="cat-chip" onclick="filterCat('anime', this)">Аниме</div>
    </div>

    <div class="catalog-grid" id="movies-list"></div>

    <div class="admin-footer" id="adminPanel">
        <button class="btn btn-secondary" style="width: 100%;" onclick="openAdminModal()">Панель управления</button>
    </div>

    <!-- Модальное окно Админки -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-body">
            <h3 style="margin: 0 0 14px 0; font-size: 16px; text-align: center;">Управление</h3>
            
            <div class="admin-tabs">
                <div class="admin-tab active" onclick="switchAdminTab('tab-add', this)">Создать</div>
                <div class="admin-tab" onclick="switchAdminTab('tab-edit', this)">Редактор</div>
                <div class="admin-tab" onclick="switchAdminTab('tab-ticket', this)">Билет</div>
            </div>

            <!-- Вкладка 1: Создание -->
            <div class="tab-content active" id="tab-add">
                <label>Название</label>
                <input type="text" id="add-title" placeholder="Астрал 5">
                <label>Обложка (URL картинки)</label>
                <input type="text" id="add-poster" placeholder="https://...">
                <label>Режиссёр / Автор</label>
                <input type="text" id="add-director" placeholder="Патрик Уилсон">
                <label>Возраст</label>
                <input type="text" id="add-age" placeholder="18+">
                <label>Дата и время сеанса</label>
                <input type="text" id="add-session" placeholder="Сегодня в 21:00">
                <label>Описание</label>
                <textarea id="add-desc" rows="2" placeholder="Краткое описание фильма..."></textarea>
                <label>Цена (руб)</label>
                <input type="number" id="add-price" placeholder="350">
                <button class="btn" style="width:100%; margin-top:12px;" onclick="createMovie()">Опубликовать</button>
            </div>

            <!-- Вкладка 2: Редактирование и перенос сеанса -->
            <div class="tab-content" id="tab-edit">
                <label>Выберите фильм для редактирования</label>
                <select id="edit-select" onchange="loadMovieToEdit()"></select>
                
                <label>Название</label>
                <input type="text" id="edit-title">
                <label>Перенос сеанса (Дата/Время)</label>
                <input type="text" id="edit-session">
                <label>Режиссёр</label>
                <input type="text" id="edit-director">
                <label>Возрастное ограничение</label>
                <input type="text" id="edit-age">
                <label>URL обложки</label>
                <input type="text" id="edit-poster">
                <label>Цена (руб)</label>
                <input type="number" id="edit-price">
                <button class="btn" style="width:100%; margin-top:12px;" onclick="saveMovieEdit()">Сохранить изменения</button>
            </div>

            <!-- Вкладка 3: Выдача билета -->
            <div class="tab-content" id="tab-ticket">
                <label>Фильм</label>
                <select id="free-select"></select>
                <label>Ряд</label>
                <input type="number" id="free-row" value="1">
                <label>Место</label>
                <input type="number" id="free-seat" value="1">
                <button class="btn btn-success" style="width:100%; margin-top:12px;" onclick="issueTicket()">Выдать бесплатный билет</button>
            </div>

            <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="closeModal('adminModal')">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно выбора мест -->
    <div class="modal-overlay" id="bookingModal">
        <div class="modal-body">
            <h3 id="book-title" style="margin: 0 0 10px 0; font-size: 16px; text-align: center;"></h3>
            <div id="book-meta" style="font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 12px;"></div>

            <div class="screen-container">
                <div class="screen"></div>
                <div class="screen-text">Экран</div>
            </div>

            <div class="seats-grid" id="seats-container"></div>

            <div id="booking-info" style="text-align:center; font-size:12px; margin-bottom:12px; color:var(--text-muted);">
                Выберите место
            </div>

            <button class="btn" style="width:100%;" onclick="goToPayment()">Забронировать</button>
            <button class="btn btn-secondary" style="width:100%; margin-top:8px;" onclick="closeModal('bookingModal')">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно оплаты -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-body">
            <h3 style="margin:0 0 12px 0; font-size:16px; text-align:center;">Оплата билета</h3>
            <div id="payment-summary" style="font-size:12px; color:var(--text-muted); margin-bottom:12px; background:var(--surface); padding:10px; border-radius:8px; border:1px solid var(--border);"></div>

            <label>Выберите способ</label>
            <div style="margin-bottom: 12px;">
                <div class="pay-card selected" onclick="selectPay(this, 'DonationAlerts')">
                    <span style="font-size:13px;">DonationAlerts</span>
                    <span style="font-size:10px; color:var(--text-muted);">Быстро</span>
                </div>
                <div class="pay-card" onclick="selectPay(this, 'Банковская карта')">
                    <span style="font-size:13px;">Карта / СБП</span>
                    <span style="font-size:10px; color:var(--text-muted);">ЮKassa</span>
                </div>
                <div class="pay-card" onclick="selectPay(this, 'Telegram Stars')">
                    <span style="font-size:13px;">Telegram Stars</span>
                    <span style="font-size:10px; color:var(--text-muted);">Stars</span>
                </div>
                <div class="pay-card" onclick="selectPay(this, 'CryptoBot')">
                    <span style="font-size:13px;">CryptoBot</span>
                    <span style="font-size:10px; color:var(--text-muted);">Crypto</span>
                </div>
            </div>

            <button class="btn btn-success" style="width:100%;" onclick="processPayment()">Подтвердить оплату</button>
            <button class="btn btn-secondary" style="width:100%; margin-top:8px;" onclick="closeModal('paymentModal')">Назад</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Анимация запуска
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            }, 300);
        });

        const ADMINS = ["siqhnn", "fuckvskrytiye", "polomad"];
        const user = tg.initDataUnsafe?.user;
        const currentUsername = (user?.username || "").toLowerCase();

        if (ADMINS.includes(currentUsername)) {
            document.getElementById('adminPanel').style.display = 'block';
        }

        let moviesData = [
            {
                id: 1,
                title: "Астрал 5",
                category: "films",
                poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500",
                director: "Патрик Уилсон",
                age: "18+",
                session: "Сегодня в 21:00",
                description: "Семья Ламберт снова сталкивается с темными сущностями своего прошлого.",
                price: 350
            }
        ];

        let selectedMovie = null;
        let selectedSeat = null;
        let selectedMethod = "DonationAlerts";

        function renderMovies(filter = 'all') {
            const list = document.getElementById('movies-list');
            list.innerHTML = '';

            moviesData.forEach(m => {
                if (filter === 'all' || m.category === filter) {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <div class="poster-container">
                            <img src="${m.poster}" class="poster-img" alt="poster" onerror="this.src='https://via.placeholder.com/400x200?text=No+Poster'">
                            <div class="age-badge">${m.age}</div>
                        </div>
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-meta-text">
                                <b>Сеанс:</b> ${m.session}<br>
                                <b>Режиссёр:</b> ${m.director}<br>
                                ${m.description}
                            </div>
                            <div class="movie-footer">
                                <div class="movie-price">${m.price} ₽</div>
                                <button class="btn" onclick="openBooking(${m.id})">Выбрать место</button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                }
            });
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderMovies(cat);
        }

        function switchAdminTab(tabId, el) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function openAdminModal() {
            const editSel = document.getElementById('edit-select');
            const freeSel = document.getElementById('free-select');
            editSel.innerHTML = '';
            freeSel.innerHTML = '';

            moviesData.forEach(m => {
                editSel.appendChild(new Option(m.title, m.id));
                freeSel.appendChild(new Option(m.title, m.id));
            });

            if (moviesData.length > 0) loadMovieToEdit();
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function createMovie() {
            const title = document.getElementById('add-title').value;
            if (!title) return alert("Введите название");

            moviesData.push({
                id: Date.now(),
                title: title,
                category: "films",
                poster: document.getElementById('add-poster').value || "",
                director: document.getElementById('add-director').value || "Не указан",
                age: document.getElementById('add-age').value || "16+",
                session: document.getElementById('add-session').value || "Сегодня в 18:00",
                description: document.getElementById('add-desc').value || "",
                price: parseInt(document.getElementById('add-price').value) || 300
            });

            renderMovies();
            closeModal('adminModal');
        }

        function loadMovieToEdit() {
            const id = parseInt(document.getElementById('edit-select').value);
            const m = moviesData.find(x => x.id === id);
            if (!m) return;

            document.getElementById('edit-title').value = m.title;
            document.getElementById('edit-session').value = m.session;
            document.getElementById('edit-director').value = m.director;
            document.getElementById('edit-age').value = m.age;
            document.getElementById('edit-poster').value = m.poster;
            document.getElementById('edit-price').value = m.price;
        }

        function saveMovieEdit() {
            const id = parseInt(document.getElementById('edit-select').value);
            const m = moviesData.find(x => x.id === id);
            if (!m) return;

            m.title = document.getElementById('edit-title').value;
            m.session = document.getElementById('edit-session').value;
            m.director = document.getElementById('edit-director').value;
            m.age = document.getElementById('edit-age').value;
            m.poster = document.getElementById('edit-poster').value;
            m.price = parseInt(document.getElementById('edit-price').value) || m.price;

            renderMovies();
            closeModal('adminModal');
        }

        function issueTicket() {
            const id = parseInt(document.getElementById('free-select').value);
            const m = moviesData.find(x => x.id === id);
            const row = document.getElementById('free-row').value;
            const seat = document.getElementById('free-seat').value;

            tg.sendData(JSON.stringify({
                action: "free_ticket",
                movie: m.title,
                session: m.session,
                row: row,
                seat: seat
            }));
            closeModal('adminModal');
        }

        function openBooking(id) {
            selectedMovie = moviesData.find(m => m.id === id);
            selectedSeat = null;

            document.getElementById('book-title').innerText = selectedMovie.title;
            document.getElementById('book-meta').innerHTML = `Сеанс: ${selectedMovie.session} | Возраст: ${selectedMovie.age}`;
            document.getElementById('booking-info').innerText = "Выберите место";

            const container = document.getElementById('seats-container');
            container.innerHTML = '';

            for (let r = 1; r <= 3; r++) {
                const row = document.createElement('div');
                row.className = 'seat-row';
                row.innerHTML = `<div class="row-label">Ряд ${r}</div>`;

                for (let s = 1; s <= 5; s++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.innerText = s;
                    seat.onclick = () => {
                        document.querySelectorAll('.seat').forEach(x => x.classList.remove('selected'));
                        seat.classList.add('selected');
                        selectedSeat = { row: r, seat: s };
                        document.getElementById('booking-info').innerHTML = `Выбрано: <b>Ряд ${r}, Место ${s}</b>`;
                    };
                    row.appendChild(seat);
                }
                container.appendChild(row);
            }

            document.getElementById('bookingModal').style.display = 'flex';
        }

        function goToPayment() {
            if (!selectedSeat) return alert("Выберите место");
            closeModal('bookingModal');

            document.getElementById('payment-summary').innerHTML = `
                <b>Фильм:</b> ${selectedMovie.title}<br>
                <b>Сеанс:</b> ${selectedMovie.session}<br>
                <b>Место:</b> Ряд ${selectedSeat.row}, Место ${selectedSeat.seat}<br>
                <b>Цена:</b> ${selectedMovie.price} ₽
            `;

            document.getElementById('paymentModal').style.display = 'flex';
        }

        function selectPay(el, method) {
            document.querySelectorAll('.pay-card').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            selectedMethod = method;
        }

        function processPayment() {
            tg.sendData(JSON.stringify({
                action: "pay",
                movie: selectedMovie.title,
                session: selectedMovie.session,
                row: selectedSeat.row,
                seat: selectedSeat.seat,
                price: selectedMovie.price,
                method: selectedMethod
            }));
        }

        renderMovies();
    </script>
</body>
</html>
